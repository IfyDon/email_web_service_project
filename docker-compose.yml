version: "3.9"
# Docker config – activate when ready
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: email_web_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
    env_file: .env

  celery:
    build: .
    command: celery -A config worker -l info
    volumes: [".:/app"]
    depends_on: [db, redis]
    env_file: .env
