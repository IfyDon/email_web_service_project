<!doctype html>
<html lang="en" class="h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MailFlow — transactional email delivery for developers" />
    <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src  'self' 'nonce-{{CSP_NONCE}}';
          style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src    'self' https://fonts.gstatic.com;
          img-src     'self' data:;
          connect-src 'self' http://localhost:8000;
          frame-ancestors 'none';
          base-uri    'self';
          form-action 'self';
        " />

  <!-- OWASP A05 – prevent clickjacking (belt-and-suspenders with X-Frame-Options header) -->
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

  <meta name="description" content="MailFlow — transactional email delivery" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google Fonts — use SRI hash in production -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />

  <title>MailFlow</title>
</head>
<body class="h-full">
  <div id="root" class="h-full"></div>
  <!-- Vite injects the bundle — nonce applied via vite plugin in production -->
  <script type="module" src="/src/main.jsx"></script>
</body>
